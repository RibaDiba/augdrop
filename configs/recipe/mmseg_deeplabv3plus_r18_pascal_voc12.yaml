# @package _global_
# Sensaug's recipe for --backbone deeplabv3plus --dataset pascal_voc12. deeplabv3plus/ has no *pascal_voc12*
# file, so Sensaug's fallback (see configs/train.yaml) took the first natural-sorted
# non-r101 config, deeplabv3plus/deeplabv3plus_r18-d8_4xb2-80k_cityscapes-512x1024.py (the task's own),
# merged _base_/datasets/pascal_voc12.py (crop 512x512, batch 4) and
# _base_/schedules/schedule_320k.py into it, and kept its optim_wrapper.
# Kept as the config says, though two parts of it look unintended:
#   - the preprocessor still pads to the cityscapes file's 512x1024, so every training and
#     probe batch is padded to that width with ignored label pixels
#   - num_classes stayed at the cityscapes file's 19 against VOC's 21, so Sensaug's loss
#     would have failed on the first batch with label 19 or 20: this pair cannot have
#     trained there. dropaug sets 21, so there is no Sensaug run to compare against
task:
  max_iters: 320000          # schedule_320k
  batch_size: 4              # per GPU; x4 GPUs = 16, no auto_scale_lr in the source
  cfg_options:
    param_scheduler.0.end: 320000   # schedule_320k's PolyLR; eta_min and power match the task's
    model.data_preprocessor.size: [512, 1024]
