# @package _global_
# Sensaug's recipe for --backbone pspnet --dataset cityscapes:
# pspnet/pspnet_r18-d8_4xb2-80k_cityscapes-512x1024.py (see configs/train.yaml), the file the
# task's .py is flattened from, so this restates the task's values.
task:
  max_iters: 80000           # schedule_80k
  batch_size: 2              # per GPU; x4 GPUs = 8 = the source's auto_scale_lr base: the lr is not rescaled
