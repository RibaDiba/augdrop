# @package _global_
# Sensaug's recipe for --backbone convnext --dataset potsdam. convnext/ has no *potsdam*
# file, so Sensaug's fallback (see configs/train.yaml) took the first natural-sorted
# non-r101 config, convnext/convnext-base-upernet_8xb2-amp-160k_cityscapes-512x1024.py (the task's own),
# merged _base_/datasets/potsdam.py (512x512, batch 4) and
# _base_/schedules/schedule_320k.py into it, and kept its optim_wrapper. num_classes was
# the file's (dropaug: the dataset's).
# schedule_320k's PolyLR(power 0.9), with no warmup, replaces the source's warmup + linear
# decay; AMP stays (it is the optim_wrapper's). The slide window stays the cityscapes 512x1024.
# The preprocessor keeps the source file's pad size, 512x1024, larger than this dataset's
# 512x512, so every training and probe batch is padded to it with ignored label pixels.
task:
  max_iters: 320000         # schedule_320k
  batch_size: 4             # per GPU; x4 GPUs = 16, no auto_scale_lr in the source
  cfg_options:
    # schedule_320k, which the fallback merges over the source's schedule
    param_scheduler:
      - {type: PolyLR, eta_min: 1.0e-4, power: 0.9, begin: 0, end: 320000, by_epoch: false}
    model.data_preprocessor.size: [512, 1024]
