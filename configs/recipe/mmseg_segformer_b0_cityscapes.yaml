# @package _global_
# Sensaug's recipe for --backbone segformer --dataset cityscapes: what its build_config
# took from segformer/segformer_mit-b0_8xb1-160k_cityscapes-1024x1024.py (the file it
# picks; see configs/train.yaml). Selected automatically (train.yaml's
# `optional recipe: ${task}_${dataset}`); a command-line override of the same key wins.
task:
  max_iters: 160000
  batch_size: 1              # per GPU; x4 GPUs = 4, no auto_scale_lr in the source
dataset:
  mmseg:
    crop_size: [1024, 1024]  # RandomCrop and the preprocessor's pad size
