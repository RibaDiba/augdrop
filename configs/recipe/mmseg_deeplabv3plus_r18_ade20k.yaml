# @package _global_
# Sensaug's recipe for --backbone deeplabv3plus --dataset ade20k:
# deeplabv3plus/deeplabv3plus_r50-d8_4xb4-80k_ade20k-512x512.py (see configs/train.yaml). Its
# natural sort picks the R50 model here, not R18, so this recipe makes the R18 task an
# R50 (as trained by Sensaug: `pretrained` is None, so from scratch, like the R18).
task:
  max_iters: 80000           # schedule_80k
  batch_size: 4              # per GPU; x4 GPUs = 16, no auto_scale_lr in the source
  cfg_options:
    model.backbone.depth: 50
    model.decode_head.in_channels: 2048
    model.decode_head.channels: 512
    model.decode_head.c1_in_channels: 256
    model.decode_head.c1_channels: 48
    model.auxiliary_head.in_channels: 1024
    model.auxiliary_head.channels: 256
