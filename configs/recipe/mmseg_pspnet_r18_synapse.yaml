# @package _global_
# Sensaug's recipe for --backbone pspnet --dataset synapse. pspnet/ has no *synapse*
# file, so Sensaug's fallback (see configs/train.yaml) took the first natural-sorted
# non-r101 config, pspnet/pspnet_r18-d8_4xb2-80k_a2i2haze.py (a2i2haze's file: it sorts before cityscapes),
# merged _base_/datasets/synapse.py (224x224 resize, no crop, batch 2) and
# _base_/schedules/schedule_320k.py into it, and kept its optim_wrapper. num_classes was
# the file's (dropaug: the dataset's).
# So the loss is that file's CE + 3 x Dice, and the preprocessor keeps its pad size,
# 512x512, larger than this dataset's
# 224x224, so every training and probe batch is padded to it with ignored label pixels.
task:
  max_iters: 320000         # schedule_320k
  batch_size: 2             # per GPU; x4 GPUs = 8, no auto_scale_lr in the source
  cfg_options:
    param_scheduler.0.end: 320000   # schedule_320k's PolyLR; eta_min and power match the task's
    model.data_preprocessor.size: [512, 512]
    auto_scale_lr.enable: false     # the source has none (at 4 x 2 = 8 the task's would not rescale either)
    # the source's loss on both heads: CE + 3 x Dice (the auxiliary head's CE at weight 1, not 0.4)
    model.decode_head.loss_decode:
      - {type: CrossEntropyLoss, loss_name: loss_ce, loss_weight: 1.0}
      - {type: DiceLoss, loss_name: loss_dice, loss_weight: 3.0}
    model.auxiliary_head.loss_decode:
      - {type: CrossEntropyLoss, loss_name: loss_ce, loss_weight: 1.0}
      - {type: DiceLoss, loss_name: loss_dice, loss_weight: 3.0}
