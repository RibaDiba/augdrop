# @package _global_
# Sensaug's recipe for --backbone pspnet --dataset potsdam:
# pspnet/pspnet_r18-d8_4xb4-80k_potsdam-512x512.py (see configs/train.yaml).
task:
  max_iters: 80000          # schedule_80k
  batch_size: 4             # per GPU; x4 GPUs = 16, no auto_scale_lr in the source
  cfg_options:
    auto_scale_lr.enable: false    # the source has none; the task's would double the lr at 4 x 4
