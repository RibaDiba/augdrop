# @package _global_
# Sensaug's recipe for --backbone pspnet --dataset acdc: the cityscapes file,
# pspnet/pspnet_r18-d8_4xb2-80k_cityscapes-512x1024.py (train.py globs *cityscapes* for acdc),
# on ACDC's train split, validated on its test split (apply_acdc_train_eval). So this
# is mmseg_pspnet_r18_cityscapes.yaml's body; keep the two in step.
task:
  max_iters: 80000           # schedule_80k
  batch_size: 2              # per GPU; x4 GPUs = 8 = the source's auto_scale_lr base: the lr is not rescaled
