# The SA loop's knobs (src/tasks/mmseg/loops.py: RobustValLoop, RobustIterBasedTrainLoop,
# SubsetTestLoop). Read only when host=sensaug; with any other host they are ignored
# (check() warns if they were changed). Defaults are Sensaug train.py's for sensaug (its
# `--aug-type ours`) / `grad_corr`; the flag each one was is noted. warmup_rounds is not
# here: it is host.warmup_rounds, and the loop refuses a value that differs from the host's.

# fraction of val each (op, level) is scored on (val_cfg.ratio), and SubsetTestLoop's
# (test_cfg.ratio, which the curve search scores through). Sensaug used one eval_ratio for
# both: 0.25, or 1.0 on ACDC (the dataset's sa_ratio)
ratio: ${oc.select:dataset.sa_ratio,0.25}
test_ratio: ${oc.select:dataset.sa_ratio,0.25}
# KID's Inception expects RGB; the loaded images are mmcv's BGR. true flips both sides
# to RGB before KID (SubsetTestLoop.kid_rgb). false is Sensaug's: BGR into Inception.
kid_rgb: true
descending_MA: false     # --descending-MA: the lowest-mIoU level of an op gets the most mass
uniform: false           # --uniform: a uniform pdf instead of the SA one
weighted_augs: false     # --weighted-augs: sa.generate_pdf_new_weighted_aug
remove_H: false          # --no-inv-aug: drop lighter_H / darker_H
# --pruned-augmentations and --hold-none-prob are the top-level prune: block
# (configs/train.yaml): prune.ops / prune.random reach the loop as its
# pruned_augmentations, and prune.hold_none_prob as its hold_none_prob.
num_levels: 5           # SA-curve search: levels per op (hard-coded in Sensaug)
tolerance: 0.05          # SA-curve search tolerance (hard-coded in Sensaug)
sa_curve_path: null      # a static curve {op: [levels]}, used by RobustBaselineValLoop only
                         # (Sensaug passed sensaug/testing/test_levels_voc.json, which its
                         # RobustValLoop asserted on but never read when searching)
init_sa: false           # --no-warmup (or resume): one val round before training so an SA pdf
                         # exists from the start. The host's pre_train_round follows it
