# ISIC 2017's 600 official test images: scored with scripts/eval.py --dataset isic2017_test on a
# model trained on `isic2017`. Same data as isic2017.yaml (data/isic2017/test/), same
# preprocessing as its val. Not a domain shift (same source): it is in isic2017's
# shift_targets only so that scripts/eval.py can select it.
name: isic2017_test
kind: seg
role: eval_only
eval_for: isic2017
num_classes: 2
data_root: ${cluster.data_root}/isic2017

mmseg:
  crop_size: [352, 352]
  dataset:
    type: BaseSegDataset
    img_suffix: .jpg
    seg_map_suffix: _segmentation.png
    reduce_zero_label: false
    metainfo:
      classes: [background, lesion]
      palette: [[0, 0, 0], [255, 255, 255]]
  val:
    data_prefix: {img_path: test/images, seg_map_path: test/masks}
    pipeline:
      - {type: LoadImageFromFile}
      - {type: Resize, scale: [352, 352], keep_ratio: false}
      - {type: LoadAnnotations}
      - {type: BinarizeLabel}
      - {type: PackSegInputs}
