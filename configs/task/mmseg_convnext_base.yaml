# UPerNet ConvNeXt-Base on mmseg. The model and optimizer are the mmengine config named
# below; tasks/mmseg/config.py writes the dataset, host, probe hooks and these keys
# into it.
backend: mmseg
backbone: convnext                    # train.py --backbone finds a task by this
config: mmseg_convnext_base.py     # relative to this directory
max_iters: 160000
batch_size: 4                              # per GPU; x4 GPUs = 8x2, the global batch of the source recipe
num_workers: 4
val_interval: ${idiv:${.max_iters},20}
checkpoint_interval: ${.val_interval}
amp: true
# Any other mmengine key, dotted, as mmseg's --cfg-options:
#   task.cfg_options={optim_wrapper.optimizer.lr:1.0e-4}
#   Sensaug's --adamw:  task.cfg_options={optim_wrapper.optimizer:{type:AdamW,lr:<lr>,weight_decay:0.0005}}
#   Sensaug's --freeze-early-layers:  task.cfg_options={model.backbone.frozen_stages:8}
cfg_options: {}
