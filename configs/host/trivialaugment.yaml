# torchvision TrivialAugmentWide's defaults. Fixed vocabulary (trivialaug_wide minus
# Identity). Probe-only: it can't augment training yet.
defaults:
  - override /vocab@_global_.vocab: trivialaug_wide

name: trivialaugment
num_magnitude_bins: 31     # magnitudes are a uniform bin of these, per image; so is the probe's
probe_interval: ${probe.schedule.interval}
probe_iters: ${probe.schedule.iters}
control_iters: ${probe.schedule.control_iters}
# Which ops the probe fades in (probe/fade.py), at this method's own magnitude: one
# uniform bin per image, shared across the ops, sign at random. See randaugment.yaml.
# Only the four with no derivative in their magnitude are faded: AutoContrast and
# Equalize have none, Posterize's bits and Solarize's 8-bit threshold only step. The
# others are d loss / d strength: Brightness, Color, Contrast and Sharpness through
# their exact tangent (torchvision's blend), the geometric ops by finite differences
# (probe.fd_step) with the label moving with the image.
fade:
  ops:
    - trivialaug_wide.Solarize
    - trivialaug_wide.Posterize
    - trivialaug_wide.AutoContrast
    - trivialaug_wide.Equalize
  at: 1.0
